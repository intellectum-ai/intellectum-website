<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Intellectum</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #004f7a;
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo { margin-bottom: 3rem; }
    .logo img { height: 36px; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }
    h1 em { font-style: italic; color: #0077b6; }
    p {
      font-size: 1rem;
      font-weight: 300;
      color: #3d7a9e;
      max-width: 420px;
      line-height: 1.75;
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      padding: 0.9rem 2.4rem;
      background: #004f7a;
      color: white;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid #004f7a;
      transition: background 0.25s, color 0.25s;
    }
    a:hover { background: transparent; color: #004f7a; }
  </style>
</head>
<body>
  <h1>Thanks for<br><em>getting in touch.</em></h1>
  <p>Your message has been received. I'll be in touch shortly.</p>
  <a href="/">Back to Intellectum</a>
</body>
</html>
